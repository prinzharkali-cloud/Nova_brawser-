<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nova</title>
<style>
:root{--bg:#000;--bg2:#0a0a0a;--bg3:#141414;--bg4:#1a1a1a;--bd:#222;--bd2:#333;--tx:#f0f0f0;--tx2:#888;--tx3:#555;--dan:#c44;--ok:#4a8}
body.light{--bg:#f5f5f5;--bg2:#fff;--bg3:#ebebeb;--bg4:#e0e0e0;--bd:#ddd;--bd2:#ccc;--tx:#000;--tx2:#666;--tx3:#999}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:inherit;-webkit-appearance:none;border-radius:0}
input:focus,textarea:focus{outline:none}
.s{display:inline-flex;align-items:center;justify-content:center;font-style:normal;line-height:1}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}
#auth.h{display:none}
.ac{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:34px 26px}
.br{text-align:center;font-size:24px;font-weight:600;letter-spacing:5px;margin-bottom:6px}
.brs{text-align:center;font-size:10px;letter-spacing:3px;color:var(--tx3);margin-bottom:30px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;padding:3px;margin-bottom:22px}
.seg button{flex:1;padding:10px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);transition:.15s}
.seg button.on{background:var(--bg4);color:var(--tx)}
.fld{margin-bottom:10px}
.fld input{width:100%;padding:14px 16px;background:var(--bg3);border:1px solid var(--bd);border-radius:10px;font-size:14px;color:var(--tx);transition:.15s}
.fld input:focus{border-color:var(--bd2);background:var(--bg4)}
.fld input::placeholder{color:var(--tx3)}
.btn{width:100%;padding:14px;background:var(--tx);color:var(--bg);border-radius:10px;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:.15s;margin-top:8px}
.btn:hover{opacity:.9}
.msg{text-align:center;font-size:12px;margin-top:14px;min-height:16px;color:var(--tx3)}
.msg.e{color:var(--dan)}.msg.s{color:var(--ok)}
.foot{text-align:center;font-size:9px;letter-spacing:2px;color:var(--tx3);margin-top:26px;text-transform:uppercase}
#app{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#app.on{display:flex}
.bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0;flex-wrap:wrap}
.usr{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;font-size:12px;color:var(--tx2);flex-shrink:0;transition:.15s}
.usr:hover{background:var(--bg4);color:var(--tx)}
.ava{width:22px;height:22px;border-radius:50%;background:var(--bg4);border:1px solid var(--bd2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--tx2);flex-shrink:0}
.nb{width:32px;height:32px;border-radius:7px;color:var(--tx2);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;background:var(--bg3);border:1px solid var(--bd)}
.nb:hover{background:var(--bg4);color:var(--tx)}
.nb:disabled{opacity:.3;cursor:not-allowed}
.sw{flex:1;position:relative;min-width:120px}
.sw input{width:100%;padding:9px 36px 9px 32px;background:var(--bg3);border:1px solid var(--bd);border-radius:9px;font-size:13px;color:var(--tx)}
.sw input:focus{border-color:var(--bd2);background:var(--bg4)}
.sw input::placeholder{color:var(--tx3)}
.sw .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:13px;pointer-events:none}
.sw .mi{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:6px;color:var(--tx3);font-size:13px;display:flex;align-items:center;justify-content:center}
.sw .mi:hover{background:var(--bg3);color:var(--tx)}
.ib{width:32px;height:32px;border-radius:7px;color:var(--tx2);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;background:var(--bg3);border:1px solid var(--bd)}
.ib:hover{background:var(--bg4);color:var(--tx)}
.prog{height:2px;background:transparent;flex-shrink:0}
.prog.on{background:var(--bd)}
.prog b{display:block;height:100%;width:0;background:var(--tx2);transition:width .3s}
.tabs{display:flex;gap:1px;padding:5px 8px 0;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0}
.tb{display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:7px 7px 0 0;background:var(--bg3);color:var(--tx3);font-size:11px;cursor:pointer;max-width:160px;min-width:90px;flex-shrink:0;transition:.15s}
.tb.on{background:var(--bg4);color:var(--tx)}
.tb .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .x{font-size:12px;color:var(--tx3);padding:0 2px;line-height:1;border-radius:3px}
.tb .x:hover{color:var(--dan)}
.tp{padding:8px 11px;color:var(--tx3);font-size:15px;flex-shrink:0}
.flt{display:flex;gap:1px;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0}
.fl{padding:6px 12px;border-radius:6px;font-size:11px;color:var(--tx3);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;transition:.15s}
.fl.on{background:var(--bg4);color:var(--tx)}
.ct{flex:1;overflow:auto;position:relative;min-height:0}
.ct::-webkit-scrollbar{width:8px}
.ct::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:4px}
.hm{padding:30px 20px;max-width:800px;margin:0 auto}
.clk{text-align:center;font-size:54px;font-weight:100;letter-spacing:6px;color:var(--tx);font-variant-numeric:tabular-nums}
.dt{text-align:center;font-size:10px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;margin-top:6px;margin-bottom:26px}
.lb{font-size:9px;letter-spacing:2.5px;color:var(--tx3);text-transform:uppercase;margin:24px 0 10px;display:flex;align-items:center;gap:12px}
.lb::after{content:'';flex:1;height:1px;background:var(--bd)}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.tl{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--tx2)}
.tl:hover{background:var(--bg3);border-color:var(--bd2);color:var(--tx);transform:translateY(-2px)}
.tl .ic{width:34px;height:34px;border-radius:8px;background:var(--bg3);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--tx2)}
.tl .nm{font-size:10px;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;text-align:center}
.rs{padding:14px 18px;max-width:800px;margin:0 auto}
.ri{padding:14px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.15s;animation:fu .3s backwards}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.ri:hover{background:var(--bg3);border-color:var(--bd2)}
.ri .t{font-size:14px;color:var(--tx);font-weight:500;margin-bottom:4px;line-height:1.4}
.ri .u{font-size:10px;color:var(--tx3);margin-bottom:7px;word-break:break-all}
.ri .d{font-size:12px;color:var(--tx2);line-height:1.6}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;padding:14px}
.ii{border-radius:9px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1;background:var(--bg2);border:1px solid var(--bd)}
.ii img{width:100%;height:100%;object-fit:cover;display:block}
.ii .cp{position:absolute;bottom:0;left:0;right:0;padding:7px 9px;background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--tx3);gap:14px;text-align:center;padding:24px}
.ep .ic{font-size:40px;opacity:.3}
.ep .tx{font-size:11px;letter-spacing:2px;text-transform:uppercase}
.ifw{height:100%;display:flex;flex-direction:column}
.ifb{display:flex;align-items:center;gap:5px;padding:8px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-shrink:0}
.ifb .u{flex:1;color:var(--tx3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
.frame-wrap{flex:1;position:relative;background:#000}
.frame-wrap iframe{width:100%;height:100%;border:none;background:#000;display:block}
.blocked{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--bg)}
.blocked.on{display:flex}
.blocked .ic{font-size:40px;color:var(--tx3);opacity:.4}
.blocked .tx{font-size:12px;color:var(--tx2);max-width:320px;line-height:1.7}
.blocked .but{padding:11px 20px;background:var(--tx);color:var(--bg);border-radius:8px;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-decoration:none;display:inline-block}
.dw{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:380px;background:var(--bg2);border-left:1px solid var(--bd);transform:translateX(100%);transition:transform .28s;z-index:70;display:flex;flex-direction:column}
.dw.on{transform:translateX(0)}
.dwh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);flex-shrink:0}
.dwh h2{font-size:11px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:var(--tx2)}
.dwb{flex:1;overflow-y:auto;padding:10px;min-height:0}
.di{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;margin-bottom:5px;font-size:13px}
.di .inf{flex:1;overflow:hidden;cursor:pointer;min-width:0}
.di .t{color:var(--tx);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di .s{font-size:10px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.di .dl{width:22px;height:22px;border-radius:5px;color:var(--tx3);font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.emp{text-align:center;padding:40px 20px;color:var(--tx3);font-size:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);padding:10px 18px;background:var(--bg4);border:1px solid var(--bd2);border-radius:8px;font-size:12px;color:var(--tx);z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translateX(-50%) translateY(0)}
@media(max-width:720px){.hide-m{display:none!important}.usr .un{display:none}.clk{font-size:42px}}
</style>
</head>
<body>

<div id="auth">
  <div class="ac">
    <div class="br">NOVA</div>
    <div class="brs">поиск · видео · сайты</div>
    <div class="seg">
      <button class="on" id="segL" type="button">Вход</button>
      <button id="segR" type="button">Регистрация</button>
    </div>
    <div class="fld"><input id="inNick" placeholder="Ник" autocomplete="off"></div>
    <div class="fld"><input id="inPass" type="password" placeholder="Пароль"></div>
    <div class="fld" id="wrapConf" style="display:none"><input id="inConf" type="password" placeholder="Повторите пароль"></div>
    <button class="btn" id="btnGo" type="button">Войти</button>
    <div class="msg" id="msg"></div>
    <div class="foot">© milanmichaimilan</div>
  </div>
</div>

<div id="app">
  <div class="bar">
    <div class="usr" id="btnUser"><div class="ava" id="ava">?</div><span class="un" id="uname">—</span></div>
    <div style="display:flex;gap:2px">
      <button class="nb" id="btnHome" title="Домой">⌂</button>
      <button class="nb" id="btnBack" title="Назад" disabled>←</button>
      <button class="nb hide-m" id="btnFwd" title="Вперёд" disabled>→</button>
      <button class="nb" id="btnRl" title="Обновить">↻</button>
    </div>
    <div class="sw">
      <span class="si">⌕</span>
      <input id="q" placeholder="Поиск или адрес" autocomplete="off">
      <button class="mi" id="btnMic" title="Голос">◉</button>
    </div>
    <button class="ib" id="btnBm" title="Закладки">★</button>
    <button class="ib hide-m" id="btnHs" title="История">⏱</button>
    <button class="ib" id="btnMenu" title="Меню">☰</button>
  </div>
  <div class="prog" id="prog"><b id="progBar"></b></div>
  <div class="tabs" id="tabs"></div>
  <div class="flt" id="flt">
    <button class="fl on" data-t="search" type="button">⌕ Всё</button>
    <button class="fl" data-t="images" type="button">▣ Картинки</button>
    <button class="fl" data-t="videos" type="button">▶ Видео</button>
    <button class="fl" data-t="news" type="button">▤ Новости</button>
  </div>
  <div class="ct" id="ct"></div>
</div>

<div class="dw" id="dw">
  <div class="dwh"><h2 id="dwTitle">Панель</h2><button class="nb" id="dwClose">✕</button></div>
  <div class="dwb" id="dwBody"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/public/app.js"></script>
</body>
</html>
