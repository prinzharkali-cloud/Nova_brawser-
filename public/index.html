<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nova Browser</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nova">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#000;
  --surface:rgba(28,28,30,0.72);
  --surface-2:rgba(44,44,46,0.9);
  --border:rgba(255,255,255,0.08);
  --border-2:rgba(255,255,255,0.14);
  --text:#f5f5f7;
  --text-2:#8e8e93;
  --text-3:#48484a;
  --accent:#a78bfa;
  --accent-2:#7c3aed;
  --accent-glow:rgba(167,139,250,0.35);
  --danger:#ff453a;
  --ok:#30d158;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-top:env(safe-area-inset-top,0px);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,textarea{font-family:inherit;color:inherit;-webkit-appearance:none;border-radius:0}
input:focus,textarea:focus{outline:none}
.s{display:inline-flex;align-items:center;justify-content:center;font-style:normal;line-height:1;font-weight:400}

/* ============ ВХОД ============ */
#auth{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100}
#auth::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(167,139,250,0.15),transparent 55%),radial-gradient(ellipse 60% 40% at 100% 100%,rgba(120,120,180,0.08),transparent 50%);animation:breathe 9s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:0.55}to{opacity:1}}
#auth.h{display:none}
.ac{position:relative;z-index:1;width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:32px 26px;backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);box-shadow:0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.06);animation:acIn 0.6s cubic-bezier(0.16,1,0.3,1)}
@keyframes acIn{from{opacity:0;transform:translateY(20px) scale(0.96);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
.logo{width:72px;height:72px;margin:0 auto 18px;border-radius:20px;background:linear-gradient(145deg,#1c1c1e,#0a0a0a);border:1px solid rgba(255,255,255,0.1);box-shadow:0 16px 40px rgba(0,0,0,0.5),0 0 60px rgba(167,139,250,0.2),inset 0 1px 0 rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.logo::after{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(167,139,250,0.2),transparent 30%);animation:shine 6s linear infinite}
@keyframes shine{to{transform:rotate(360deg)}}
.br{text-align:center;font-size:24px;font-weight:700;letter-spacing:-0.03em;margin-bottom:4px;background:linear-gradient(90deg,#fff 0%,#fff 42%,#a78bfa 50%,#fff 58%,#fff 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:brandSweep 4.5s ease-in-out infinite}
@keyframes brandSweep{0%{background-position:100% 0}100%{background-position:-100% 0}}
.brs{text-align:center;font-size:12px;color:var(--text-2);margin-bottom:24px;letter-spacing:0.02em}
.seg{display:flex;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:12px;padding:3px;margin-bottom:20px}
.seg button{flex:1;padding:10px;border-radius:9px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-2);transition:.2s}
.seg button.on{background:rgba(255,255,255,0.08);color:#fff}
.fld{margin-bottom:10px}
.fld input{width:100%;padding:14px 16px;background:rgba(0,0,0,0.35);border:1px solid var(--border);border-radius:12px;font-size:14px;color:var(--text);transition:.15s}
.fld input:focus{border-color:var(--accent);background:rgba(0,0,0,0.5);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
.fld input::placeholder{color:var(--text-3)}
.btn{width:100%;padding:14px;background:#fff;color:#000;border-radius:12px;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;transition:.2s;margin-top:6px}
.btn:active{transform:scale(0.98)}
.msg{text-align:center;font-size:12px;margin-top:12px;min-height:16px;color:var(--text-2)}
.msg.e{color:var(--danger)}.msg.s{color:var(--ok)}
.foot{text-align:center;font-size:10px;letter-spacing:2px;color:var(--text-3);margin-top:20px;text-transform:uppercase}

/* ============ APP ============ */
#app{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg)}
#app.on{display:flex}
#app::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 40% at 50% -10%,rgba(167,139,250,0.08),transparent 55%),radial-gradient(ellipse 60% 40% at 100% 110%,rgba(120,120,180,0.05),transparent 50%)}
#app > *{position:relative;z-index:1}

.topbar{display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(15,15,20,0.72);backdrop-filter:blur(28px) saturate(1.6);-webkit-backdrop-filter:blur(28px) saturate(1.6);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:nowrap;padding-top:calc(10px + var(--safe-top))}
.usr{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 4px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--text-2);flex-shrink:0;transition:.15s;font-weight:500}
.usr:active{background:rgba(255,255,255,0.1);color:#fff}
.ava{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.navb{display:flex;gap:2px;flex-shrink:0}
.nb{width:34px;height:34px;border-radius:9px;color:var(--text-2);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;flex-shrink:0}
.nb:active{background:rgba(255,255,255,0.08);color:#fff;transform:scale(0.94)}
.nb:disabled{opacity:.25;cursor:not-allowed}
.sw{flex:1;position:relative;min-width:100px}
.sw input{width:100%;padding:10px 40px 10px 36px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:12px;font-size:14px;color:#fff;transition:.15s}
.sw input:focus{border-color:var(--accent);background:rgba(0,0,0,0.55);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
.sw input::placeholder{color:var(--text-3)}
.sw .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:14px;pointer-events:none}
.sw .mi{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:8px;color:var(--text-2);font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s}
.sw .mi:active{background:rgba(255,255,255,0.1);color:#fff}
.ib{width:34px;height:34px;border-radius:9px;color:var(--text-2);font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;position:relative}
.ib:active{background:rgba(255,255,255,0.1);color:#fff;transform:scale(0.94)}
.ib.accent{color:var(--accent);background:rgba(167,139,250,0.1)}
.ib.accent:active{background:rgba(167,139,250,0.25)}

.prog{height:2px;background:transparent;flex-shrink:0;overflow:hidden}
.prog.on{background:rgba(255,255,255,0.06)}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#fff);transition:width .3s;box-shadow:0 0 10px var(--accent-glow)}

.tabs{display:flex;gap:1px;padding:6px 10px 0;background:rgba(15,15,20,0.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px 8px 0 0;background:rgba(255,255,255,0.04);color:var(--text-3);font-size:12px;cursor:pointer;max-width:170px;min-width:100px;flex-shrink:0;transition:.15s;font-weight:500}
.tb.on{background:rgba(255,255,255,0.1);color:#fff}
.tb .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb .x{font-size:12px;color:var(--text-3);padding:0 3px;line-height:1;border-radius:3px}
.tb .x:active{color:var(--danger)}
.tp{padding:8px 12px;color:var(--text-3);font-size:16px;flex-shrink:0;border-radius:8px 8px 0 0;font-weight:500}
.tp:active{background:rgba(255,255,255,0.06);color:#fff}

.flt{display:flex;gap:6px;padding:10px 12px;background:rgba(15,15,20,0.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;scrollbar-width:none}
.flt::-webkit-scrollbar{display:none}
.fl{padding:7px 14px;border-radius:20px;font-size:12px;color:var(--text-2);white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;transition:.15s;background:rgba(255,255,255,0.04);border:1px solid var(--border);font-weight:500}
.fl.on{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(167,139,250,0.35)}

.ct{flex:1;overflow:auto;position:relative;min-height:0;-webkit-overflow-scrolling:touch}
.ct::-webkit-scrollbar{width:8px}
.ct::-webkit-scrollbar-thumb{background:rgba(120,140,200,0.25);border-radius:4px}

/* Главная */
.hm{padding:36px 20px 20px;max-width:720px;margin:0 auto;animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.clk{text-align:center;font-size:60px;font-weight:100;letter-spacing:4px;color:#fff;font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 60px rgba(167,139,250,0.3)}
.dt{text-align:center;font-size:11px;letter-spacing:3px;color:var(--text-3);text-transform:uppercase;margin-top:10px;margin-bottom:34px}
.lb{font-size:10px;letter-spacing:2.5px;color:var(--text-3);text-transform:uppercase;margin:26px 0 12px;display:flex;align-items:center;gap:12px;font-weight:600}
.lb::after{content:'';flex:1;height:1px;background:var(--border)}
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.tl{display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 6px;background:var(--surface);border:1px solid var(--border);border-radius:14px;cursor:pointer;transition:.15s;text-decoration:none;color:var(--text-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tl:active{background:rgba(255,255,255,0.08);border-color:var(--accent);color:#fff;transform:scale(0.96)}
.tl .ic{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.06);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-2)}
.tl .nm{font-size:11px;color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;text-align:center;font-weight:500}

/* Результаты */
.rs{padding:16px 18px;max-width:720px;margin:0 auto}
.ri{padding:16px 18px;background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:8px;cursor:pointer;transition:.15s;animation:fu .35s cubic-bezier(0.16,1,0.3,1) backwards;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.ri:active{background:rgba(255,255,255,0.08);border-color:var(--accent)}
.ri .t{font-size:15px;color:#fff;font-weight:600;margin-bottom:5px;line-height:1.35}
.ri .u{font-size:11px;color:var(--text-3);margin-bottom:8px;word-break:break-all;letter-spacing:0.3px}
.ri .d{font-size:13px;color:var(--text-2);line-height:1.55}
.engines-bar{font-size:10px;color:var(--text-3);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase}
.answer-box{padding:18px;background:linear-gradient(135deg,rgba(167,139,250,0.12),rgba(124,58,237,0.08));border:1px solid rgba(167,139,250,0.25);border-radius:16px;margin-bottom:14px;animation:fadeUp 0.5s}
.answer-box .ab-label{font-size:9px;letter-spacing:2.5px;color:var(--accent);text-transform:uppercase;margin-bottom:10px;font-weight:700}
.answer-box .ab-text{font-size:14px;color:#fff;line-height:1.65}

/* Картинки */
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:16px}
.ii{border-radius:12px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1;background:var(--surface);border:1px solid var(--border);transition:.2s}
.ii:active{transform:scale(0.97)}
.ii img{width:100%;height:100%;object-fit:cover;display:block}
.ii .cp{position:absolute;bottom:0;left:0;right:0;padding:8px 10px;background:linear-gradient(transparent,rgba(0,0,0,0.9));color:#fff;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Пусто */
.ep{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text-3);gap:16px;text-align:center;padding:24px}
.ep .ic{font-size:44px;opacity:.35}
.ep .tx{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;font-weight:600}

/* Iframe */
.ifw{height:100%;display:flex;flex-direction:column;background:#000}
.ifb{display:flex;align-items:center;gap:5px;padding:8px 10px;background:rgba(15,15,20,0.72);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.ifb .u{flex:1;color:var(--text-3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px;letter-spacing:0.3px}
.frame-wrap{flex:1;position:relative;background:#000}
.frame-wrap iframe{width:100%;height:100%;border:none;background:#000;display:block}
.blocked{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:var(--bg)}
.blocked.on{display:flex}
.blocked .ic{font-size:44px;color:var(--text-3);opacity:.4}
.blocked .tx{font-size:13px;color:var(--text-2);max-width:320px;line-height:1.7}
.blocked .but{padding:12px 22px;background:#fff;color:#000;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;display:inline-block}

/* Drawer */
.dw{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:400px;background:rgba(12,12,14,0.92);backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .35s cubic-bezier(0.16,1,0.3,1);z-index:70;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,0.5)}
.dw.on{transform:translateX(0)}
.dwh{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(18px + var(--safe-top))}
.dwh h2{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:#fff}
.dwb{flex:1;overflow-y:auto;padding:14px;min-height:0}
.dwb::-webkit-scrollbar{width:6px}
.dwb::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
.di{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-bottom:6px;font-size:14px;transition:.15s}
.di:active{background:rgba(255,255,255,0.08)}
.di .inf{flex:1;overflow:hidden;cursor:pointer;min-width:0}
.di .t{color:#fff;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.di .s{font-size:11px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0.3px}
.di .dl{width:26px;height:26px;border-radius:8px;color:var(--text-3);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.di .dl:active{color:var(--danger);background:rgba(255,69,58,0.15)}
.emp{text-align:center;padding:50px 20px;color:var(--text-3);font-size:12px;letter-spacing:1px;font-weight:500}

/* AI Panel */
.ai{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:440px;background:rgba(12,12,14,0.94);backdrop-filter:blur(40px) saturate(1.4);-webkit-backdrop-filter:blur(40px) saturate(1.4);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .35s cubic-bezier(0.16,1,0.3,1);z-index:80;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,0.6)}
.ai.on{transform:translateX(0)}
.aih{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);flex-shrink:0;padding-top:calc(16px + var(--safe-top))}
.aih h2{font-size:14px;font-weight:700;letter-spacing:-0.02em;color:#fff}
.aih .st{font-size:10px;color:var(--text-3);margin-left:8px;letter-spacing:0.5px;font-weight:500;text-transform:uppercase}
.aib{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.aib::-webkit-scrollbar{width:6px}
.aib::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15);border-radius:3px}
.m{max-width:86%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.55;word-wrap:break-word;white-space:pre-wrap;animation:mIn 0.35s cubic-bezier(0.16,1,0.3,1) backwards}
@keyframes mIn{from{opacity:0;transform:translateY(8px)}}
.m.u{align-self:flex-end;background:#fff;color:#000;border-bottom-right-radius:5px;font-weight:500}
.m.a{align-self:flex-start;background:var(--surface-2);color:#f2f2f7;border:1px solid var(--border);border-bottom-left-radius:5px}
.m.err{align-self:flex-start;background:rgba(255,69,58,0.12);border:1px solid rgba(255,69,58,0.35);color:#ff8a80;font-size:13px}
.aif{padding:12px 14px calc(12px + var(--safe-bottom));border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0;background:rgba(15,15,20,0.72);backdrop-filter:blur(20px)}
.aif textarea{flex:1;padding:12px 16px;background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:16px;font-size:14px;color:#fff;resize:none;min-height:44px;max-height:120px;font-family:inherit;line-height:1.4;transition:.15s}
.aif textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(167,139,250,0.15)}
.aif textarea::placeholder{color:var(--text-3)}
.aif button{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.aif button:active{transform:scale(0.92)}
.aif button:disabled{opacity:.35}

/* Mobile nav */
.mnv{display:none;background:rgba(15,15,20,0.9);backdrop-filter:blur(28px) saturate(1.6);border-top:1px solid var(--border);padding:8px 4px calc(8px + var(--safe-bottom));justify-content:space-around;flex-shrink:0}
.mnb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:10px;color:var(--text-3);font-size:9.5px;letter-spacing:0.5px;transition:.15s;text-transform:uppercase;font-weight:600}
.mnb:active{background:rgba(255,255,255,0.06);color:#fff}
.mnb .s{font-size:19px}

/* Toast */
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(80px);padding:12px 20px;background:rgba(28,28,30,0.95);backdrop-filter:blur(20px);border:1px solid var(--border-2);border-radius:14px;font-size:13px;color:#fff;z-index:200;transition:transform .3s cubic-bezier(0.16,1,0.3,1);max-width:90vw;text-align:center;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.toast.on{transform:translateX(-50%) translateY(0)}

@media(max-width:720px){
  .hide-m{display:none!important}
  .usr .un{display:none}
  .clk{font-size:48px}
  .hm{padding:26px 14px}
  .rs{padding:12px}
  .dw,.ai{max-width:100%}
  .mnv{display:flex}
  .ct{padding-bottom:0}
  .toast{bottom:calc(90px + var(--safe-bottom))}
}
</style>
</head>
<body>

<!-- ============ ВХОД ============ -->
<div id="auth">
  <div class="ac">
    <div class="logo">N</div>
    <div class="br">NOVA</div>
    <div class="brs">браузер · поиск · видео</div>
    <div class="seg">
      <button class="on" id="segL" type="button">Вход</button>
      <button id="segR" type="button">Регистрация</button>
    </div>
    <div class="fld"><input id="inNick" placeholder="Ник" autocomplete="off"></div>
    <div class="fld"><input id="inPass" type="password" placeholder="Пароль"></div>
    <div class="fld" id="wrapConf" style="display:none"><input id="inConf" type="password" placeholder="Повторите пароль"></div>
    <button class="btn" id="btnGo" type="button">Войти</button>
    <div class="msg" id="msg"></div>
    <div class="foot">© milanmichaimilan</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <div class="usr" id="btnUser"><div class="ava" id="ava">?</div><span class="un" id="uname">—</span></div>
    <div class="navb">
      <button class="nb" id="btnHome" title="Домой"><span class="s">⌂</span></button>
      <button class="nb" id="btnBack" title="Назад" disabled><span class="s">←</span></button>
      <button class="nb hide-m" id="btnFwd" title="Вперёд" disabled><span class="s">→</span></button>
      <button class="nb hide-m" id="btnRl" title="Обновить"><span class="s">↻</span></button>
    </div>
    <div class="sw">
      <span class="si"><span class="s">⌕</span></span>
      <input id="q" placeholder="Поиск или адрес" autocomplete="off">
      <button class="mi" id="btnMic" title="Голос"><span class="s">◉</span></button>
    </div>
    <button class="ib accent" id="btnAI" title="ChatClaud"><span class="s">◈</span></button>
    <button class="ib" id="btnBm" title="Закладки"><span class="s">★</span></button>
    <button class="ib" id="btnMenu" title="Меню"><span class="s">☰</span></button>
  </div>

  <div class="prog" id="prog"><b id="progBar"></b></div>
  <div class="tabs" id="tabs"></div>
  <div class="flt" id="flt">
    <button class="fl on" data-t="search" type="button"><span class="s">⌕</span>Всё</button>
    <button class="fl" data-t="images" type="button"><span class="s">▣</span>Картинки</button>
    <button class="fl" data-t="videos" type="button"><span class="s">▶</span>Видео</button>
    <button class="fl" data-t="news" type="button"><span class="s">▤</span>Новости</button>
  </div>
  <div class="ct" id="ct"></div>

  <div class="mnv">
    <button class="mnb" id="mHome" type="button"><span class="s">⌂</span>Домой</button>
    <button class="mnb" id="mAI" type="button"><span class="s">◈</span>AI</button>
    <button class="mnb" id="mBm" type="button"><span class="s">★</span>Метки</button>
    <button class="mnb" id="mHs" type="button"><span class="s">⏱</span>История</button>
    <button class="mnb" id="mMenu" type="button"><span class="s">☰</span>Ещё</button>
  </div>
</div>

<!-- DRAWER -->
<div class="dw" id="dw">
  <div class="dwh"><h2 id="dwTitle">Панель</h2><button class="nb" id="dwClose"><span class="s">✕</span></button></div>
  <div class="dwb" id="dwBody"></div>
</div>

<!-- AI PANEL -->
<div class="ai" id="ai">
  <div class="aih">
    <div style="display:flex;align-items:baseline;gap:2px"><h2>ChatClaud</h2><span class="st" id="aiSt">готов</span></div>
    <div style="display:flex;gap:2px">
      <button class="nb" id="aiClr" title="Очистить"><span class="s">⌫</span></button>
      <button class="nb" id="aiClose" title="Закрыть"><span class="s">✕</span></button>
    </div>
  </div>
  <div class="aib" id="aib"></div>
  <div class="aif">
    <textarea id="aiIn" placeholder="Спроси или дай команду..." rows="1"></textarea>
    <button id="aiSend" type="button"><span class="s">↑</span></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/public/app.js"></script>
</body>
</html>
